name: Release

on:
    workflow_dispatch:
        inputs:
            prerelease:
                description: The npm dist-tag to publish under. Leave empty for a stable release.
                required: false
                default: beta
                type: string
            major:
                description: Bump the major version. Without this a breaking change bumps the minor.
                required: false
                default: false
                type: boolean
            dry-run:
                description: Show the next version and its changelog, and change nothing.
                required: false
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PRERELEASE: ${{ inputs.prerelease }}
                  MAJOR: ${{ inputs.major && '--major' || '' }}
                  DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
              run: pnpm release --ci ${PRERELEASE:+--pre "$PRERELEASE"} $MAJOR $DRY_RUN

    deploy-docs:
        name: Deploy docs
        needs: release
        if: ${{ !inputs.dry-run }}
        uses: ./.github/workflows/deploy-docs.yaml
        secrets:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
